<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'">
<link rel="stylesheet" href="katex.min.css"><style>
html,body{margin:0;padding:0;background:transparent;color:inherit;overflow:hidden}
#math{padding:6px 2px;box-sizing:border-box}.formula{overflow-x:auto;overflow-y:hidden;padding:5px 0;max-width:100%;scrollbar-width:thin}
.katex-display{margin:0;text-align:center}.katex-display>.katex{white-space:nowrap}
.fallback{white-space:pre-wrap;overflow-wrap:anywhere;font-family:serif}.error{font:12px sans-serif}
.prose{font-family:system-ui,sans-serif;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.theory strong{color:var(--concept);font-weight:750}
.theory em{color:var(--secondary)}
.theory u{color:var(--underline);text-decoration-thickness:1.5px;text-underline-offset:3px}
.theory tbody td:first-child{font-weight:650;color:var(--concept)}
.math-inline{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;white-space:normal}
.math-inline .katex{white-space:nowrap}
.table-scroll{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;border-radius:8px;margin:6px 0}
table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:1em;line-height:1.45}
th,td{border:1px solid #87909c;padding:9px 12px;min-width:125px;max-width:240px;vertical-align:top;text-align:left}
th{background:rgba(128,128,128,.13);font-weight:700}td .math-inline{max-width:240px}
</style><script defer src="katex.min.js"></script><script defer src="rich-text.js"></script><script defer src="render.js"></script></head>
<body><main id="math" aria-label="Expresiones matemáticas"></main></body></html>
